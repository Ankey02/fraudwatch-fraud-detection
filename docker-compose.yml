services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud_pw
      POSTGRES_DB: fraudwatch
    ports:
      - "5435:5432"
    volumes:
      - fraud_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraudwatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=fraudwatch;Username=fraud;Password=fraud_pw"
      ASPNETCORE_ENVIRONMENT: Development   # demo only: enables /demo/seed and the API docs
    ports:
      - "5100:8080"

volumes:
  fraud_pgdata:
